<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Management System</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <div style="text-align: center; margin-bottom: 15px;">
            <i class="fa-solid fa-boxes-stacked" style="font-size: 38px; color: #2563eb;"></i>
        </div>

        <h2>Inventory Management System</h2>
        <p>Login to Access Your Dashboard</p>

        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px; color:#4b5563;">EMAIL ADDRESS</label>
                <input 
                    type="email"
                    id="email"
                    placeholder="e.g. admin@ims.com"
                    value="admin@ims.com"
                    required
                    style="width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px; color:#4b5563;">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    value="admin123"
                    required
                    style="width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; box-sizing:border-box;">
            </div>

            <!-- Quick Demo Credentials helper buttons -->
            <div style="margin-bottom: 18px; text-align: center;">
                <span style="font-size: 11px; color: #6b7280; display: block; margin-bottom: 6px;">DEMO ONE-CLICK FILL:</span>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button type="button" class="demo-btn" onclick="fillDemo('admin@ims.com', 'admin123')" style="background:#e0e7ff; color:#3730a3; border:none; padding:5px 10px; border-radius:6px; font-size:12px; cursor:pointer;">Admin</button>
                    <button type="button" class="demo-btn" onclick="fillDemo('manager@ims.com', 'manager123')" style="background:#fef3c7; color:#92400e; border:none; padding:5px 10px; border-radius:6px; font-size:12px; cursor:pointer;">Manager</button>
                    <button type="button" class="demo-btn" onclick="fillDemo('staff@ims.com', 'staff123')" style="background:#dcfce7; color:#166534; border:none; padding:5px 10px; border-radius:6px; font-size:12px; cursor:pointer;">Staff</button>
                </div>
            </div>

            <button type="submit" id="loginBtn" style="width:100%; padding:14px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer;">
                <span id="btnText">Sign In to Dashboard</span>
            </button>

            <div id="loginError" style="display:none; margin-top:15px; padding:10px; background:#fee2e2; border:1px solid #ef4444; color:#b91c1c; border-radius:6px; font-size:13px; text-align:center;"></div>
        </form>

        <div style="margin-top:20px; text-align:center;">
            <a href="index.html" style="color:#6b7280; text-decoration:none; font-size:13px;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
